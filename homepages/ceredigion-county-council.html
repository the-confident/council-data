<!DOCTYPE html>
<html lang="en-gb">
<head>
    <!-- Google tag (gtag.js) -->

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ceredigion County Council</title>
    <!--favicon-->
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <!--external styles - bootstrap etc.-->
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/lib/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="/css/splash.css">

    <!--google fonts - belleza & open sans-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" crossorigin href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Belleza&amp;family=Open&#x2B;Sans:wght@400;700&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open&#x2B;Sans:wght@400;700&amp;display=swap">
</head>
<body>
    <div class="d-flex flex-column vh-100">
        <!--introductory content-->
        <section id="council-website" class="mt-3 mt-md-4 mt-xl-5 mb-3 h-100" role="main">
            <div class="container">
                <div class="row">
                    <div class="col-12 col-lg-10 offset-lg-1 col-xl-8 offset-xl-2">
                        <div class="d-flex flex-column flex-md-row justify-content-center justify-content-md-between justify-content-lg-evenly justify-content-xl-between justify-content-xxl-evenly flex-nowrap">
                            <!--button xs and sm view-->
                            <div class="d-flex justify-content-center d-md-none order-2 my-1">
                                <a class="btn btn-primary col-5" href="/preswyliwr" role="button">Cymraeg</a>
                            </div>
                            <!--button xs and sm view-->
                            <div class="d-flex justify-content-center d-md-none order-3 my-1">
                                <a class="btn btn-primary col-5" href="/resident" role="button">English</a>
                            </div>
                            <!--button md view and above-->
                            <div class="d-none d-md-block order-md-1 mt-5">
                                <a class="btn btn-primary py-md-3" href="/preswyliwr" role="button">Croeso<br>Ewch i'n gwefan Cymraeg</a>
                            </div>
                            <!--button md view and above-->
                            <div class="d-none d-md-block order-md-3 mt-5">
                                <a class="btn btn-primary py-md-3" href="/resident" role="button">Welcome<br>Visit our English website</a>
                            </div>
                            <!--image and text-->
                            <div class="order-1 order-md-2">
                                <img src="images/splash-page-crest.png" class="img-fluid d-block mb-1 mb-md-2 mx-auto" alt="Ceredigion council crest">
                                <h1 class="text-center">Cyngor Sir<br><span class="text-uppercase">Ceredigion</span><br>County Council</h1>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!--tourism information-->
        <div id="tourism" class="flex-shrink-1 mb-3">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <img src="images/tourism.png" class="img-fluid d-block mx-auto mb-3" alt="Ceredigion tourism logo">
                        <div class="d-flex flex-row justify-content-center">
                            <a class="btn btn-primary btn-sm mx-1" href="https://www.darganfodceredigion.cymru/" role="button">Twristiaeth</a>
                            <a class="btn btn-primary btn-sm mx-1" href="https://www.discoverceredigion.wales/" role="button">Tourism</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!--jQuery-->
    <script src="/lib/jquery/dist/jquery.min.js"></script>
    <!--bootstrap javascript-->
    <script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
